# Configuración de osint-recon
# Copia este fichero a config.ini y rellena lo que necesites:
#   cp config.example.ini config.ini

[api_keys]
# Clave de Have I Been Pwned (SOLO para el módulo 'breaches', de pago).
# Consíguela en: https://haveibeenpwned.com/API/Key
# NO es necesaria para buscar brechas: el módulo 'breaches_free' (XposedOrNot)
# funciona gratis y sin clave.
hibp =

[settings]
# User-Agent usado en las peticiones HTTP.
user_agent = osint-recon/1.0

# Hilos para la comprobación paralela de usernames.
threads = 10

# Tiempo límite (segundos) para herramientas externas (theHarvester, holehe).
ext_timeout = 180

# Región por defecto (ISO 3166, 2 letras) para interpretar teléfonos SIN prefijo
# internacional. Ej: ES para España. Los números con +XX se detectan solos.
phone_region = ES

# Módulo de noticias (Google News RSS): idioma, país y nº máximo de titulares.
news_lang = es
news_country = ES
news_max = 10

# Permutación de emails (módulo 'permutations'): genera emails candidatos del
# nombre y los comprueba en brechas. 'permute_common' añade proveedores comunes
# (gmail/hotmail/outlook/yahoo). 'permute_max' limita cuántos comprobar (ojo al
# límite de 100 consultas/día de XposedOrNot).
permute_emails = on
permute_common = off
permute_max = 15
